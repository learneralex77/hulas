version: '3.8'

services:
  # PHP Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hulas_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:cached
      - ./storage:/var/www/html/storage:delegated
      - ./vendor:/var/www/html/vendor:delegated
    environment:
      PHP_MEMORY_LIMIT: 512M
      COMPOSER_MEMORY_LIMIT: -1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_BUCKET: ${AWS_BUCKET}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - hulas_network

  # Nginx Webserver
  webserver:
    image: nginx:alpine
    container_name: hulas_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:cached
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:cached
      - ./storage/logs/nginx:/var/log/nginx:delegated
    depends_on:
      - app
    networks:
      - hulas_network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: hulas_redis
    command: redis-server --appendonly yes
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hulas_network

networks:
  hulas_network:
    driver: bridge

volumes:
  redis_data:
